<title>Unearth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>

  color-scheme: dark;

html, body { height: 100%; }

  overflow: hidden; touch-action: none; overscroll-behavior: none;

}
#c {

  image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; background: var(--bg);
}
.hud { position: fixed; pointer-events: none; z-index: 2; text-shadow: 0 0 6px rgba(0, 0, 0, 0.9); }
#obj {
  top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px));
  max-width: min(70vw, 460px); line-height: 1.05; letter-spacing: 0.04em;
}
#obj .t { color: var(--dim); font-size: 16px; text-transform: uppercase; letter-spacing: 0.12em; }
#obj .o { color: var(--ink); font-size: 22px; }
#cells { color: var(--gas); letter-spacing: 0.2em; font-size: 22px; }
#sub {
  left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18%);
  width: min(86vw, 640px); text-align: center; font-size: 26px; line-height: 1.05; color: var(--ink);
  transition: opacity 0.4s; opacity: 0;
}
#hint {

#cross { left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; background: var(--ink); opacity: 0.55; }
#fire {

#fire.on { background: rgba(255, 179, 71, 0.35); }
#stick, #knob { position: fixed; z-index: 3; border-radius: 50%; pointer-events: none; }
#stick { width: 120px; height: 120px; margin: -60px 0 0 -60px; border: 2px solid rgba(207, 233, 234, 0.35); }
#knob { width: 52px; height: 52px; margin: -26px 0 0 -26px; background: rgba(207, 233, 234, 0.30); }
#menu {

  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; justify-content: space-between;

#menu .tag { color: var(--dim); font-size: 18px; letter-spacing: 0.08em; }
#menu .tag b { color: var(--ray); font-weight: normal; }
#menu .btns { display: flex; flex-wrap: wrap; gap: 10px; pointer-events: auto; }
button.b {
  font: inherit; font-size: 20px; letter-spacing: 0.08em; color: var(--ink); background: var(--panel);
  border: 1px solid var(--dim); padding: 8px 14px; border-radius: 2px; text-transform: uppercase;
}

  position: fixed; z-index: 6; inset: 0; background: rgba(2, 5, 6, 0.94); overflow-y: auto; touch-action: pan-y;
